# Local MySQL profile; credentials must be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/codematch}
spring.datasource.username=${DB_USERNAME:dotconn_local}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
server.address=127.0.0.1
