spring.datasource.url=jdbc:mysql://localhost:3306/codematch
spring.datasource.username=codematch
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=3600

# Creates this user at startup if it doesn't exist yet
app.seed.email=admin@example.com
app.seed.password=${SEED_PASSWORD:}
