spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codematch}
spring.datasource.username=${DB_USERNAME:codematch}
spring.datasource.password=${DB_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=3600

# Comma-separated list of frontend origins allowed to call /api/**
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Creates this user at startup if it doesn't exist yet
app.seed.email=admin@example.com
app.seed.password=${SEED_PASSWORD:}

# Opt-in synthetic demo data, restricted by DemoDataSeeder to local development profiles.
app.demo.enabled=${MICROCREW_DEMO_ENABLED:false}

# Stripe test subscriptions only; keys stay on the backend.
app.billing.secret-key=${STRIPE_SECRET_KEY:}
app.billing.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.frontend-url=${BILLING_FRONTEND_URL:http://127.0.0.1:5173}
app.billing.price-bronze=${STRIPE_PRICE_BRONZE:}
app.billing.price-silver=${STRIPE_PRICE_SILVER:}
app.billing.price-gold=${STRIPE_PRICE_GOLD:}
